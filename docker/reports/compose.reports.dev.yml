services:
  bexia_reports:
    image: bexia_php85_reports_worker:perf23c
    container_name: bexia_dev_reports
    pull_policy: never
    restart: unless-stopped
    init: true
    user: "33:33"
    working_dir: /var/www/html

    entrypoint:
      - /bin/sh
      - /var/www/html/docker/reports/worker.sh

    env_file:
      - /opt/bexia/dev/.env

    environment:
      TZ: "America/Mexico_City"
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      CACHE_STORE: array
      SESSION_DRIVER: array

    networks:
      - bexia_dev_net

    volumes:
      - /opt/bexia/dev:/var/www/html:ro
      - /opt/bexia/dev/storage/app/private/reports:/var/www/html/storage/app/private/reports:rw

    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777,size=256m
      - /var/www/html/storage/framework/views:rw,nosuid,nodev,uid=33,gid=33,mode=0700,size=64m

    read_only: true
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    pids_limit: 128
    stop_signal: SIGTERM
    stop_grace_period: 390s

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  bexia_dev_net:
    external: true
    name: bexia_dev_net
