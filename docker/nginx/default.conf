server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;
    charset utf-8;

    # tamaño permitido para uploads (por si Nginx corta antes)
    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Livewire assets/endpoints
    location ^~ /livewire/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # estáticos
    location ~* \.(?:css|js|mjs|map|jpg|jpeg|gif|png|svg|ico|webp|woff2?|ttf|eot)$ {
        try_files $uri $uri/ /index.php?$query_string;
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location ~ \.php$ {
        try_files $uri =404;

        # OJO: fastcgi_params muchas veces NO pasa HTTP_HOST; lo agregamos explícito
        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # ✅ MUY IMPORTANTE: pasar host real al backend (firma de Livewire depende de esto)
        fastcgi_param HTTP_HOST       $host;
        fastcgi_param SERVER_NAME     $host;

        # ✅ Forwarded headers (Traefik -> Nginx)
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_PORT  $http_x_forwarded_port;
        fastcgi_param HTTP_X_FORWARDED_HOST  $http_x_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;

        # ✅ Forzar contexto HTTPS hacia PHP (Traefik termina TLS, pero Laravel debe "sentir" https)
        fastcgi_param HTTPS          on;
        fastcgi_param SERVER_PORT    443;
        fastcgi_param REQUEST_SCHEME https;

        # buffers (Livewire devuelve payloads grandes)
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        fastcgi_pass bexia_app:9000;
        fastcgi_connect_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;

    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
