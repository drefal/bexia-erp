version: "3.9"

services:
  # PHP-FPM (Laravel)
  bexia_app:
    container_name: bexia_app
    build: ./docker/app
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"

      # PostgreSQL
      DB_CONNECTION: pgsql
      DB_HOST: bexia_pg
      DB_PORT: "5432"
      DB_DATABASE: bexia
      DB_USERNAME: bexia
      DB_PASSWORD: secret

      SESSION_DRIVER: file
      CACHE_DRIVER: file
      QUEUE_CONNECTION: sync
    volumes:
      - ./:/var/www/html
    networks:
      - bexia_net
    depends_on:
      - bexia_pg
      - bexia_redis
    restart: unless-stopped

  # Nginx
  bexia_web:
    container_name: bexia_web
    image: nginx:alpine
    depends_on:
      - bexia_app
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bexia_net"

      # HTTPS router
      - "traefik.http.routers.app-bexia.rule=Host(`app.bexiaerp.com`)"
      - "traefik.http.routers.app-bexia.entrypoints=websecure"
      - "traefik.http.routers.app-bexia.tls=true"
      - "traefik.http.routers.app-bexia.tls.certresolver=le"
      - "traefik.http.services.app-bexia.loadbalancer.server.port=80"

      # ✅ Middleware para permitir uploads grandes (30MB)
      - "traefik.http.middlewares.app-bexia-buffer.buffering.maxRequestBodyBytes=31457280"
      - "traefik.http.middlewares.app-bexia-buffer.buffering.memRequestBodyBytes=31457280"
      - "traefik.http.routers.app-bexia.middlewares=app-bexia-buffer"

      # HTTP router -> redirect to HTTPS
      - "traefik.http.routers.app-bexia-http.rule=Host(`app.bexiaerp.com`)"
      - "traefik.http.routers.app-bexia-http.entrypoints=web"
      - "traefik.http.routers.app-bexia-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    networks:
      - bexia_net
    restart: unless-stopped

  # PostgreSQL 16
  bexia_pg:
    container_name: bexia_pg
    image: postgres:16
    environment:
      POSTGRES_DB: bexia
      POSTGRES_USER: bexia
      POSTGRES_PASSWORD: secret
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bexia_pg:/var/lib/postgresql/data
    networks:
      - bexia_net
    restart: unless-stopped

  # MySQL (queda, pero ya NO lo usa Laravel)
  bexia_db:
    container_name: bexia_db
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: bexia
      MYSQL_USER: bexia
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - bexia_mysql:/var/lib/mysql
    networks:
      - bexia_net
    restart: unless-stopped

  # Redis
  bexia_redis:
    container_name: bexia_redis
    image: redis:alpine
    networks:
      - bexia_net
    restart: unless-stopped

networks:
  bexia_net:
    external: true

volumes:
  bexia_mysql:
    external: true
    name: grupol7_bexia_mysql

  bexia_pg:
    external: true
    name: grupol7_bexia_pg